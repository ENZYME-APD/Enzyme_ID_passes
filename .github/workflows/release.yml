name: Build & release

# Every push builds the plugin.
# Releasing: bump `version:` in yak/manifest.yml and push to main (or push a tag like v0.3.0).
# If that version has no GitHub Release yet, the workflow creates the release (and tag) with
# the .rhp files, the .yak and the script, then publishes to the Rhino package server when the
# YAK_TOKEN secret is set (create it once with `yak login --ci`, add under Settings > Secrets > Actions).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build plugin/EnzymeIDPasses.csproj -c Release

      - name: Decide version / release
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = ((Select-String -Path yak/manifest.yml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value).Trim() }
          "version=$v" >> $env:GITHUB_OUTPUT
          $release = "false"
          if ("${{ github.event_name }}" -eq "push" -and ("${{ github.ref_type }}" -eq "tag" -or "${{ github.ref_name }}" -eq "main")) {
            gh release view "v$v" -R "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $release = "true" }
          }
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v - release: $release"
          exit 0

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force "$stage/net48", "$stage/net7.0" | Out-Null
          Copy-Item plugin/bin/Release/net48/EnzymeIDPasses.rhp  "$stage/net48/"
          Copy-Item plugin/bin/Release/net7.0/EnzymeIDPasses.rhp "$stage/net7.0/"
          Copy-Item yak/manifest.yml, assets/icon.png, LICENSE "$stage/"
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content "$stage/manifest.yml") -replace '^version:.*', "version: $v" | Set-Content "$stage/manifest.yml"

      - name: Build Yak package
        shell: pwsh
        run: |
          Invoke-WebRequest https://files.mcneel.com/yak/tools/0.15.1/win-x64/yak.exe -OutFile yak.exe
          Push-Location dist/stage
          ../../yak.exe build --platform any
          Move-Item *.yak ..
          Pop-Location
          Get-ChildItem dist/*.yak

      - uses: actions/upload-artifact@v4
        with:
          name: EnzymeIDPasses
          path: |
            dist/*.yak
            dist/stage/net48/EnzymeIDPasses.rhp
            dist/stage/net7.0/EnzymeIDPasses.rhp
            script/EnzymeIDPasses.py

      - name: GitHub Release
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item dist/stage/net7.0/EnzymeIDPasses.rhp dist/EnzymeIDPasses-net7.0.rhp
          Copy-Item dist/stage/net48/EnzymeIDPasses.rhp  dist/EnzymeIDPasses-net48.rhp
          $yak = (Get-ChildItem dist/*.yak).FullName
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag $yak dist/EnzymeIDPasses-net7.0.rhp dist/EnzymeIDPasses-net48.rhp script/EnzymeIDPasses.py --target "${{ github.sha }}" --title "Enzyme ID Passes $tag" --generate-notes

      - name: Publish to Rhino package server
        # Runs for main/tag pushes; skips if this version is already on the server.
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'main') && env.YAK_TOKEN != ''
        shell: pwsh
        run: |
          $lines = @($env:YAK_TOKEN -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($lines.Count -ne 1) { Write-Host "::warning::YAK_TOKEN has $($lines.Count) non-empty lines; using the last one." }
          $env:YAK_TOKEN = $lines[-1]
          $v = "${{ steps.ver.outputs.version }}"
          $found = ./yak.exe search --all --prerelease EnzymeIDPasses 2>$null | Out-String
          if ($found -match "EnzymeIDPasses \($([regex]::Escape($v))\)") { Write-Host "v$v already on the package server - skipping"; exit 0 }
          $yak = (Get-ChildItem dist/*.yak).FullName
          ./yak.exe push $yak
